<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ward Watcher — Live Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}" />
  <script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
</head>
<body>

<header>
  <div class="header-title">Ward <span>Watcher</span></div>

  <div id="server-status-wrap">
    <div id="hb-dot"></div>
    <span id="hb-label">Connecting…</span>
  </div>

  <button id="sound-btn" class="hdr-btn" title="Toggle alarm sound">🔇 Sound</button>
  <a href="/db" class="hdr-btn">Database →</a>
</header>

<div id="conn-banner">⚠ SERVER OFFLINE — Dashboard is not receiving data</div>

<main>

  <!-- Room connection status panel -->
  <section id="room-connections">
    <div class="section-header">
      <h2>Room Connections</h2>
      <span id="room-count"></span>
    </div>
    <div id="room-grid">
      <p class="room-grid-empty">Waiting for rooms to connect…</p>
    </div>
  </section>

  <div class="panel-divider"></div>

  <!-- Active alerts -->
  <div class="section-header">
    <h2>Active Alerts</h2>
    <span id="alert-count">0</span>
  </div>

  <div id="empty-state">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <p>No active alerts — all rooms are clear.</p>
  </div>

  <ul id="alert-list"></ul>

</main>

<script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
