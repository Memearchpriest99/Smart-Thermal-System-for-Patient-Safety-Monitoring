    // ── Client-side thermal preprocessing (Canvas API) ───────────────
    // Mirrors the student capstone pipeline:
    //   smoothing    → Gaussian blur (3×3 kernel, iterative passes)
    //   bgsub        → Mean-field background subtraction
    //   stretch      → Contrast stretching (histogram equalization)
    //   edge overlay → Sobel edge detection overlaid in cyan
    //   invert       → Invert all channels

    function gaussianBlur3x3(data, w, h) {
        // 3×3 Gaussian kernel (same kernel the capstone used)
        const kernel = [1,2,1, 2,4,2, 1,2,1];
        const ksum = 16;
        const out = new Uint8ClampedArray(data.length);
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                let r=0, g=0, b=0, a=0;
                for (let ky = -1; ky <= 1; ky++) {
                    for (let kx = -1; kx <= 1; kx++) {
                        const nx = Math.min(Math.max(x+kx, 0), w-1);
                        const ny = Math.min(Math.max(y+ky, 0), h-1);
                        const ki = (ky+1)*3 + (kx+1);
                        const pi = (ny*w + nx)*4;
                        r += data[pi]   * kernel[ki];
                        g += data[pi+1] * kernel[ki];
                        b += data[pi+2] * kernel[ki];
                        a += data[pi+3] * kernel[ki];
                    }
                }
                const oi = (y*w + x)*4;
                out[oi]   = r/ksum;
                out[oi+1] = g/ksum;
                out[oi+2] = b/ksum;
                out[oi+3] = a/ksum;
            }
        }
        return out;
    }

    function applyClientFilters(imgEl) {
        const s = filterState;
        const hasClientFilter = s.smooth > 0 || s.bgsub > 0 || s.stretch > 0 || s.edge > 0 || s.invert;
        if (!hasClientFilter) {
            // Remove any canvas overlay — show original img
            const existing = imgEl.parentElement.querySelector(".filter-canvas");
            if (existing) existing.style.display = "none";
            imgEl.style.display = "";
            return;
        }

        // Draw img onto offscreen canvas, apply pipeline, display result
        const offscreen = document.createElement("canvas");
        offscreen.width  = imgEl.naturalWidth  || imgEl.width  || 320;
        offscreen.height = imgEl.naturalHeight || imgEl.height || 240;
        const ctx = offscreen.getContext("2d");
        ctx.drawImage(imgEl, 0, 0);
        const id = ctx.getImageData(0, 0, offscreen.width, offscreen.height);
        let d = id.data;
        const w = offscreen.width, h = offscreen.height;

        // 1. Gaussian smoothing (N passes of 3×3)
        if (s.smooth > 0) {
            for (let pass = 0; pass < s.smooth; pass++) {
                d = gaussianBlur3x3(d, w, h);
            }
        }

        // 2. Background subtraction (mean-field) — subtract mean luminance scaled by strength
        if (s.bgsub > 0) {
            const strength = s.bgsub / 100;
            let sum = 0;
            for (let i = 0; i < d.length; i+=4) sum += (d[i] + d[i+1] + d[i+2]) / 3;
            const mean = sum / (d.length/4);
            for (let i = 0; i < d.length; i+=4) {
                d[i]   = Math.min(255, Math.max(0, d[i]   - mean * strength + 128 * strength));
                d[i+1] = Math.min(255, Math.max(0, d[i+1] - mean * strength + 128 * strength));
                d[i+2] = Math.min(255, Math.max(0, d[i+2] - mean * strength + 128 * strength));
            }
        }

        // 3. Contrast stretch (redistribute histogram to 0–255 range)
        if (s.stretch > 0) {
            const strength = s.stretch / 100;
            // Find per-channel min/max
            let rMin=255,rMax=0,gMin=255,gMax=0,bMin=255,bMax=0;
            for (let i = 0; i < d.length; i+=4) {
                rMin=Math.min(rMin,d[i]);   rMax=Math.max(rMax,d[i]);
                gMin=Math.min(gMin,d[i+1]); gMax=Math.max(gMax,d[i+1]);
                bMin=Math.min(bMin,d[i+2]); bMax=Math.max(bMax,d[i+2]);
            }
            for (let i = 0; i < d.length; i+=4) {
                const rRange = (rMax-rMin) || 1;
                const gRange = (gMax-gMin) || 1;
                const bRange = (bMax-bMin) || 1;
                d[i]   = d[i]   * (1-strength) + ((d[i]  -rMin)/rRange*255) * strength;
                d[i+1] = d[i+1] * (1-strength) + ((d[i+1]-gMin)/gRange*255) * strength;
                d[i+2] = d[i+2] * (1-strength) + ((d[i+2]-bMin)/bRange*255) * strength;
            }
        }

        // 4. Sobel edge detection overlay (cyan edges)
        if (s.edge > 0) {
            const strength = s.edge / 100;
            // Compute luminance
            const lum = new Float32Array(w*h);
            for (let i = 0; i < w*h; i++) lum[i] = (d[i*4] + d[i*4+1] + d[i*4+2]) / 3;
            // Sobel
            for (let y = 1; y < h-1; y++) {
                for (let x = 1; x < w-1; x++) {
                    const gx = -lum[(y-1)*w+(x-1)] + lum[(y-1)*w+(x+1)]
                               -2*lum[y*w+(x-1)]   + 2*lum[y*w+(x+1)]
                               -lum[(y+1)*w+(x-1)] + lum[(y+1)*w+(x+1)];
                    const gy = -lum[(y-1)*w+(x-1)] - 2*lum[(y-1)*w+x] - lum[(y-1)*w+(x+1)]
                               +lum[(y+1)*w+(x-1)] + 2*lum[(y+1)*w+x] + lum[(y+1)*w+(x+1)];
                    const mag = Math.min(255, Math.sqrt(gx*gx + gy*gy));
                    const pi = (y*w+x)*4;
                    // Blend cyan edge over existing pixel
                    d[pi]   = d[pi]   * (1 - mag/255*strength);        // R: darken
                    d[pi+1] = Math.min(255, d[pi+1] + mag*strength);   // G: brighten
                    d[pi+2] = Math.min(255, d[pi+2] + mag*strength);   // B: brighten → cyan
                }
            }
        }

        // 5. Invert
        if (s.invert) {
            for (let i = 0; i < d.length; i+=4) {
                d[i]   = 255-d[i];
                d[i+1] = 255-d[i+1];
                d[i+2] = 255-d[i+2];
            }
        }

        // Write processed data to a display canvas inside the cell
        let canvas = imgEl.parentElement.querySelector(".filter-canvas");
        if (!canvas) {
            canvas = document.createElement("canvas");
            canvas.className = "filter-canvas";
            canvas.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:contain;";
            imgEl.parentElement.appendChild(canvas);
        }
        canvas.width  = w;
        canvas.height = h;
        const outCtx = canvas.getContext("2d");
        const outId = outCtx.createImageData(w, h);
        outId.data.set(d);
        outCtx.putImageData(outId, 0, 0);
        canvas.style.display = "";
        imgEl.style.display = "none";   // hide raw img, show canvas
    }

        if (!name || !filterPresets[name]) return;
        const s = filterPresets[name];
        filterState = {...s};
        fTempMin.value = s.tempMin ?? -20;   document.getElementById("f-temp-min-val").textContent = s.tempMin===null?"auto":(s.tempMin+"°C");
        fTempMax.value = s.tempMax ?? 200;   document.getElementById("f-temp-max-val").textContent = s.tempMax===null?"auto":(s.tempMax+"°C");
        fColormap.value = s.colormap || "";  fInvert.checked = s.invert || false;
        fSmooth.value  = s.smooth  || 0;    document.getElementById("f-smooth-val").textContent  = s.smooth  ? `${s.smooth}×` : "off";
        fBgsub.value   = s.bgsub   || 0;    document.getElementById("f-bgsub-val").textContent   = s.bgsub   ? `${s.bgsub}%` : "off";
        fStretch.value = s.stretch || 0;    document.getElementById("f-stretch-val").textContent = s.stretch ? `${s.stretch}%` : "off";
        fEdge.value    = s.edge    || 0;    document.getElementById("f-edge-val").textContent    = s.edge    ? `${s.edge}%` : "off";
        applyAllClientFilters();
        scheduleNpzReload();
        showToast(`Preset "${name}" loaded`, "success");
    });

    // ── Init ─────────────────────────────────────────────────────────
    async function init() {
        // Fetch config
        const res = await fetch("/api/config");
        CONFIG = await res.json();

        buildClassColorMap();   // build event-class → colour map from config
        const camCount = CONFIG.video.cameras_per_room || 3;

        // ── Populate FPS block ───────────────────────────────────────
        const srcFps = getSourceFps();
        fpsSrcDisplay.textContent = srcFps;

        // Build display FPS dropdown from config options
        const fpsOptions = CONFIG.video.display_fps_options || [1, 2, 4, 8, 12, 15, 25];
        const configDisplayFps = CONFIG.video.display_fps || 8;
        selDisplayFps.innerHTML = "";
        fpsOptions.forEach(f => {
            const opt = document.createElement("option");
            opt.value = f;
            opt.textContent = f;
            if (f === configDisplayFps) opt.selected = true;
            selDisplayFps.appendChild(opt);
        });
        updateFpsStepHint();

        // When annotator changes display FPS at runtime
        selDisplayFps.addEventListener("change", () => {
            updateFpsStepHint();
            // If NPZ is playing, restart timer at new rate
            if (isNpzLike() && isPlaying) {
                npzStopPlayback();
                npzStartPlayback();
            }
            // Resync slider max for current session
            if (isNpzLike() && npzDuration > 0) {
                slider.max = Math.floor(npzDuration * 1000);
            }
            updateTimeDisplay();
        });

        // Build video grid
        buildVideoGrid(camCount);

        // Load filter presets
        loadFilterPresets();

        // Build speed buttons from config
        CONFIG.video.playback_speeds.forEach(speed => {
            const btn = document.createElement("button");
            btn.className = "ctrl-btn" + (speed === 1 ? " active" : "");
            btn.textContent = speed + "×";
            btn.addEventListener("click", () => setSpeed(speed));
            speedControls.appendChild(btn);
        });

        // Build hotkey hints from config
        const hk = CONFIG.hotkeys;
        const eventKeys = Object.keys(CONFIG.annotation.event_classes);
        hotkeyHint.innerHTML =
            `<kbd>${hk.mark_in.toUpperCase()}</kbd> In &nbsp;` +
            `<kbd>${hk.mark_out.toUpperCase()}</kbd> Out &nbsp;` +
            `<kbd>F1-F${camCount}</kbd> Cams &nbsp;` +
            `<kbd>${(hk.toggle_all_cameras || 'A').toUpperCase()}</kbd> All &nbsp;` +
            `<kbd>${eventKeys.join(",")}</kbd> Save`;

        // Populate rooms
        const roomRes = await fetch("/api/rooms");
        const roomData = await roomRes.json();
        selRoom.innerHTML = '<option value="">-- Select Room --</option>';
        roomData.rooms.forEach(r => {
            const opt = document.createElement("option");
            opt.value = r; opt.textContent = r;
            selRoom.appendChild(opt);
        });

        // Room change → fetch available folders and populate Year
        selRoom.addEventListener("change", async () => {
            selYear.innerHTML = '<option value="">YYYY</option>';
            selMonth.innerHTML = '<option value="">MM</option>';
            selDay.innerHTML = '<option value="">DD</option>';
            availableDates = [];

            if (!selRoom.value) return;
            const dateRes = await fetch(`/api/dates/${selRoom.value}`);
            const dateData = await dateRes.json();
            availableDates = dateData.dates; // e.g. ["2026-04-19", "2026-04-20"]

            // Extract unique years
            const years = [...new Set(availableDates.map(d => d.split("-")[0]))].sort();
            years.forEach(y => {
                if (y && y.length === 4) selYear.appendChild(new Option(y, y));
            });
        });

        // Year change → populate Month
        selYear.addEventListener("change", () => {
            selMonth.innerHTML = '<option value="">MM</option>';
            selDay.innerHTML = '<option value="">DD</option>';
            if (!selYear.value) return;

            const yearDates = availableDates.filter(d => d.startsWith(selYear.value + "-"));
            const months = [...new Set(yearDates.map(d => d.split("-")[1]))].sort();
            months.forEach(m => {
                if (m) selMonth.appendChild(new Option(m, m));
            });
        });

        // Month change → populate Day
        selMonth.addEventListener("change", () => {
            selDay.innerHTML = '<option value="">DD</option>';
            if (!selMonth.value) return;

            const prefix = `${selYear.value}-${selMonth.value}-`;
            const monthDates = availableDates.filter(d => d.startsWith(prefix));
            const days = [...new Set(monthDates.map(d => d.split("-")[2]))].sort();
            days.forEach(d => {
                if (d) selDay.appendChild(new Option(d, d));
            });
        });

        btnLoad.addEventListener("click", loadSession);

        // Set muted from config
        if (CONFIG.video.default_muted) {
            videoElements.forEach(v => v.muted = true);
        }
    }

    // Redraw timelines on window resize so canvases refit their containers
    window.addEventListener("resize", () => drawTimelines());

    init();
})();
</script>
</body>
</html>
