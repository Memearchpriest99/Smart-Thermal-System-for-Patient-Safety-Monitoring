[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal_algorithms"
version = "0.1.0"
description = "Algorithms for the Smart Thermal System for Patient Safety Monitoring."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Guy Chen" },
    { name = "Yaniv Blau" },
    { name = "Roy Lieberman" },
]
license = { text = "Proprietary - Afeka College of Engineering" }
keywords = ["thermal", "computer-vision", "patient-monitoring", "multi-view"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.6",
    "openpyxl>=3.1",   # reading labels.xlsx in scripts/check_label_agreement.py
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thermal_algorithms*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
